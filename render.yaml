services:
  - type: db
    name: krishiclinic-db
    databaseName: krishiclinic
    user: postgres
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: "Allow Vercel frontend and external tools connection"

  - type: web
    name: krishiclinic-backend
    env: python
    plan: free
    buildCommand: cd backend && pip install --upgrade pip && pip install -r requirements.txt && PYTHONPATH=. alembic upgrade head
    startCommand: cd backend && PYTHONPATH=. uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: krishiclinic-db
          property: connectionString
      - key: AI_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: UPLOAD_DIR
        value: uploads
